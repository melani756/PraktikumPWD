<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocs Official Store - Latihan 5</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">crocs 🐊</a>
            <div class="d-flex align-items-center">
                <button id="toggleCartBtn" class="btn btn-crocs">
                    🛒 Keranjang (<span id="cartCount">0</span>) - Rp <span id="cartTotal">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Banner Promo -->
        <div class="p-4 p-md-5 mb-4 rounded-4 text-white banner-promo">
            <div class="col-md-8 px-0">
                <h1 class="display-5 fw-bold">Come As You Are</h1>
                <p class="lead my-3">Katalog lengkap sandal & clog Crocs pilihan terbaik untuk kenyamanan aktivitas harianmu.</p>
            </div>
        </div>

       
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="input-group shadow-sm rounded-pill overflow-hidden">
                    <span class="input-group-text bg-white border-0 ps-3">🔍</span>
                    <input type="text" id="searchInput" class="form-control border-0 py-2" placeholder="Cari seri Crocs favoritmu...">
                </div>
            </div>
        </div>

       
        <div id="cartPanel" class="card shadow-lg mb-4 cart-panel">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">🛒 Keranjang Belanja Crocs</h5>
                <button id="clearCartBtn" class="btn btn-sm btn-outline-danger rounded-pill">Kosongkan Keranjang</button>
            </div>
            <div class="card-body">
                <ul id="cartList" class="list-group list-group-flush mb-3">
                    <li class="list-group-item text-muted text-center py-3">Keranjangmu masih kosong. Yuk pilih Crocs favoritmu!</li>
                </ul>
                <div class="d-flex justify-content-between align-items-center fw-bold fs-5 px-2">
                    <span>Total Harga:</span>
                    <span class="text-success">Rp <span id="cartPanelTotal">0</span></span>
                </div>
                <button id="checkoutBtn" class="btn btn-crocs w-100 mt-3 py-2 fs-6">Checkout Sekarang</button>
            </div>
        </div>

       
        <div id="orderSummary" class="mt-4"></div>

      
        <h3 class="fw-bold mb-4">Katalog Lengkap Produk Crocs</h3>
        <div id="productContainer" class="row g-4">
            <!-- Rendered via JS -->
        </div>
    </div>

    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        
        const products = [
            { id: 1, nama: "Crocs Classic Clog - Black", harga: 999000, stok: 8, img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=500&q=80" },
            { id: 2, nama: "Crocs Echo Clog - Stucco", harga: 1599000, stok: 5, img: "https://images.unsplash.com/photo-1603808033192-082d6919d3e1?auto=format&fit=crop&w=500&q=80" },
            { id: 3, nama: "Crocs Bayaband Clog - White", harga: 1199000, stok: 12, img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?auto=format&fit=crop&w=500&q=80" },
            { id: 4, nama: "Crocs Classic Mega Crush Clog", harga: 1799000, stok: 4, img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=500&q=80" },
            { id: 5, nama: "Crocs Mellow Recovery Slide", harga: 899000, stok: 10, img: "https://images.unsplash.com/photo-1608256246200-53e635b5b65f?auto=format&fit=crop&w=500&q=80" },
            { id: 6, nama: "Crocs Classic All-Terrain Clog", harga: 1399000, stok: 6, img: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=500&q=80" },
            { id: 7, nama: "Crocs Baya Clog - Navy Blue", harga: 1099000, stok: 9, img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=500&q=80" },
            { id: 8, nama: "Crocs Classic Crush Boot", harga: 1999000, stok: 3, img: "https://images.unsplash.com/photo-1603808033192-082d6919d3e1?auto=format&fit=crop&w=500&q=80" },
            { id: 9, nama: "Crocs Brooklyn Low Wedge", harga: 1299000, stok: 7, img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

       
        $(document).ready(function() {
            renderProducts();

            
            $("#toggleCartBtn").click(function() {
                $("#cartPanel").fadeToggle("fast");
            });

           
            $("#searchInput").on("keyup", function() {
                let keyword = $(this).val().toLowerCase();
                
                $(".product-card-wrapper").each(function() {
                    let productName = $(this).data("name").toLowerCase();
                    $(this).toggle(productName.indexOf(keyword) > -1);
                });
            });

           
            $("#clearCartBtn").click(function() {
                if (cart.length === 0) {
                    alert("Keranjang belanja sudah kosong!");
                    return;
                }

             
                if (confirm("Apakah Anda yakin ingin mengosongkan keranjang belanja?")) {
                    cart.forEach(cartItem => {
                        let product = products.find(p => p.id === cartItem.id);
                        if (product) {
                            product.stok += cartItem.qty;
                            document.getElementById(`stock-${product.id}`).innerText = "Stok: " + product.stok;
                        }
                    });

                    cart = [];
                    $("#cartList").empty().html('<li class="list-group-item text-muted text-center py-3">Keranjangmu masih kosong. Yuk pilih Crocs favoritmu!</li>');
                    updateCartDisplay();
                }
            });

            $("#checkoutBtn").click(function() {
                if (cart.length === 0) {
                    alert("Keranjang Anda masih kosong. Silakan pilih produk terlebih dahulu!");
                    return;
                }

                let namaPembeli = prompt("Masukkan nama pembeli untuk pesanan Crocs:");
                if (namaPembeli) {
                    let totalHargaStr = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

                    let listItemsHTML = cart.map(item => 
                        `<li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${item.nama} <strong>(x${item.qty})</strong></span>
                            <span>Rp ${(item.harga * item.qty).toLocaleString()}</span>
                        </li>`
                    ).join("");

                    let ringkasanHTML = `
                        <div class="alert alert-success shadow border-0 rounded-4 p-4">
                            <h4 class="alert-heading fw-bold">🎉 Pesanan Berhasil Dibuat!</h4>
                            <p>Terima kasih telah berbelanja di Crocs Official Store, <strong>${namaPembeli}</strong>.</p>
                            <hr>
                            <h6 class="fw-bold">Rincian Pembelian:</h6>
                            <ul class="list-group mb-3">
                                ${listItemsHTML}
                            </ul>
                            <div class="d-flex justify-content-between align-items-center fw-bold fs-5">
                                <span>Total Pembayaran:</span>
                                <span>Rp ${totalHargaStr.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    
                    $("#orderSummary").html(ringkasanHTML);
                    
                    cart = [];
                    $("#cartList").empty().html('<li class="list-group-item text-muted text-center py-3">Keranjangmu masih kosong. Yuk pilih Crocs favoritmu!</li>');
                    updateCartDisplay();
                    $("#cartPanel").fadeOut();

                    $('html, body').animate({
                        scrollTop: $("#orderSummary").offset().top - 100
                    }, 500);
                }
            });
        });

     
        function renderProducts() {
            const container = document.getElementById("productContainer");
            container.innerHTML = "";

            products.forEach(product => {
                const colDiv = document.createElement("div");
                colDiv.className = "col-12 col-md-6 col-lg-4 product-card-wrapper";
                colDiv.setAttribute("data-name", product.nama);

                const cardDiv = document.createElement("div");
                cardDiv.className = "card card-product h-100";

                const img = document.createElement("img");
                img.src = product.img;
                img.className = "card-img-top product-img";
                img.alt = product.nama;

                const cardBody = document.createElement("div");
                cardBody.className = "card-body d-flex flex-column p-4";

                const title = document.createElement("h5");
                title.className = "card-title fw-bold mb-2";
                title.appendChild(document.createTextNode(product.nama));

                const price = document.createElement("p");
                price.className = "card-text text-success fs-5 fw-bold mb-1";
                price.appendChild(document.createTextNode("Rp " + product.harga.toLocaleString()));

                const stock = document.createElement("p");
                stock.className = "card-text text-muted small mb-3";
                stock.id = `stock-${product.id}`;
                stock.appendChild(document.createTextNode("Stok: " + product.stok));

                const btn = document.createElement("button");
                btn.className = "btn btn-crocs w-100 mt-auto";
                btn.appendChild(document.createTextNode("Tambah ke Keranjang"));
                btn.onclick = function() {
                    addToCart(product.id);
                };

                cardBody.appendChild(title);
                cardBody.appendChild(price);
                cardBody.appendChild(stock);
                cardBody.appendChild(btn);

                cardDiv.appendChild(img);
                cardDiv.appendChild(cardBody);

                colDiv.appendChild(cardDiv);
                container.appendChild(colDiv);
            });
        }

        
        function addToCart(productId) {
            let product = products.find(p => p.id === productId);

            
            if (product.stok <= 0) {
                alert("Maaf! Stok untuk produk " + product.nama + " sudah habis.");
                return;
            }

            product.stok--;
            document.getElementById(`stock-${product.id}`).innerText = "Stok: " + product.stok;

            let cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ id: product.id, nama: product.nama, harga: product.harga, qty: 1 });
            }

            updateCartUI();
        }

  
        function updateCartUI() {
            let cartList = $("#cartList");
            cartList.empty();

            if (cart.length === 0) {
                cartList.html('<li class="list-group-item text-muted text-center py-3">Keranjangmu masih kosong. Yuk pilih Crocs favoritmu!</li>');
            } else {
                cart.forEach(item => {
                    let li = $(`
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="mb-0 fw-bold">${item.nama}</h6>
                                <small class="text-muted">${item.qty} x Rp ${item.harga.toLocaleString()}</small>
                            </div>
                            <button class="btn btn-sm btn-outline-danger remove-item rounded-pill" data-id="${item.id}">Hapus</button>
                        </li>
                    `);
                    
                   
                    li.hide().appendTo(cartList).fadeIn(300);
                });
            }

            $(".remove-item").click(function() {
                let id = $(this).data("id");
                removeItemFromCart(id, $(this).closest("li"));
            });

            updateCartDisplay();
        }

        
        function removeItemFromCart(productId, liElement) {
         
            if (confirm("Apakah Anda yakin ingin menghapus item ini dari keranjang?")) {
                let index = cart.findIndex(item => item.id === productId);
                if (index !== -1) {
                    let removed = cart[index];
                    
                    let product = products.find(p => p.id === productId);
                    product.stok += removed.qty;
                    document.getElementById(`stock-${product.id}`).innerText = "Stok: " + product.stok;

                    cart.splice(index, 1);
                }

        
                liElement.fadeOut(300, function() {
                    $(this).remove();
                    if (cart.length === 0) {
                        $("#cartList").html('<li class="list-group-item text-muted text-center py-3">Keranjangmu masih kosong. Yuk pilih Crocs favoritmu!</li>');
                    }
                    updateCartDisplay();
                });
            }
        }

        function updateCartDisplay() {
            let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

            $("#cartCount").text(totalItems);
            $("#cartTotal").text(totalPrice.toLocaleString());
            $("#cartPanelTotal").text(totalPrice.toLocaleString());
        }
    </script>
</body>
</html>
